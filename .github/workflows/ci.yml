name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner .

  lab-02-zero-trust-mcp-gateway:
    name: Lab 02 — Zero-Trust MCP Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/02-zero-trust-mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/02-zero-trust-mcp-gateway/requirements.txt
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.9.0
      - run: pip install -r requirements.txt
      - name: Rego policy tests
        run: opa test policies -v
      - name: Gateway tests
        run: python -m pytest -q

  lab-04-golden-path:
    name: Lab 04 — AI Engineering Golden Path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: labs/04-ai-engineering-golden-path
    env:
      # test_generated_content_has_no_environment_values asserts the OS user name
      # never appears in generated files. The runner's default user, "runner", is
      # an ordinary English word that the templates legitimately contain, so give
      # the job a user name that cannot collide with template text.
      USER: ci-labs-user
      LOGNAME: ci-labs-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/04-ai-engineering-golden-path/requirements.txt
      # Editable install so the CLI subprocess tests can run `python -m golden_path`.
      - run: pip install -r requirements.txt -e .
      - run: python -m pytest -q

  lab-05-changebrief:
    name: Lab 05 — ChangeBrief app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/05-production-llm-service/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: labs/05-production-llm-service/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Next.js generates LayoutProps/PageProps types; tsc needs them first.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
