[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-golden-path"
version = "0.1.0"
description = "Lab 04 AI Engineering Golden Path: deterministic capability scaffolding."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
]

[project.scripts]
ai-golden-path = "golden_path.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
