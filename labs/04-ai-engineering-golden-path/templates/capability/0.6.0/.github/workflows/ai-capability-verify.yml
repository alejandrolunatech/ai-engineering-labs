# Generated by the golden path (template 0.6.0).
#
# Transport/orchestration only: every verification rule lives in the verifier
# (verifier/ai_capability.py). CI runs exactly the command developers run
# locally. Do not add pytest, evaluator, schema or tool checks here; the
# verifier's ci.workflow check fails if CI re-implements a verifier-owned gate.
#
# GitHub only runs workflows from the REPOSITORY ROOT: this file works when
# this capability is its own repository.
#
# Supply-chain note: actions are pinned to major-version tags, not commit
# SHAs. This workflow is not supply-chain hardened.
name: ai-capability-verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: ai-capability verify
